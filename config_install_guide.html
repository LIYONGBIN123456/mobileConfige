<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cloak</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            padding: 40px 0 20px;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1c1c1e;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #8e8e93;
            font-size: 14px;
            margin-bottom: 24px;
        }
        
        .download-btn {
            background-color: #007aff;
            border: none;
            width: 100%;
            padding: 16px 24px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .download-btn:active {
            background-color: #005fc1;
            transform: scale(0.98);
        }
        
        .download-btn.loading {
            background-color: #8e8e93;
            opacity: 0.7;
        }
        
        .steps-card {
            background-color: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .steps-title {
            font-size: 17px;
            font-weight: 600;
            color: #1c1c1e;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .steps-title::before {
            content: "📋";
            font-size: 18px;
        }
        
        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .step-num {
            width: 24px;
            height: 24px;
            background-color: #007aff;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            flex-shrink: 0;
        }
        
        .step-text {
            flex: 1;
            font-size: 15px;
            color: #3a3a3c;
            line-height: 1.4;
        }
        
        .step-text strong {
            color: #1c1c1e;
            font-weight: 600;
        }
        
        .info-card {
            background-color: #e8f4ff;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .info-icon {
            font-size: 24px;
        }
        
        .info-text {
            flex: 1;
            font-size: 13px;
            color: #0051a8;
            line-height: 1.4;
        }
        
        .status {
            text-align: center;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="appName">Cloak</h1>
            <div class="subtitle" id="subtitle">Rename · Disguise Icon Tutorial</div>
        </div>
        
        <button class="download-btn" id="downloadBtn" onclick="startDownload()">
            <span>📲</span>
            <span id="btnText">Download Configuration Profile</span>
        </button>
        
        <div id="status" class="status hidden"></div>
        
        <div class="steps-card">
            <div class="steps-title" id="stepsTitle">Installation Steps</div>
            <div id="stepsList"></div>
        </div>
        
        <div class="info-card">
            <div class="info-icon">💡</div>
            <div class="info-text" id="infoText">
                If nothing happens, please check your network and try again
            </div>
        </div>
    </div>

    <script>
        // 多语言文本
        const translations = {
            "en": {
                appName: "Cloak",
                subtitle: "Rename · Disguise Icon Tutorial",
                btnText: "Download Configuration Profile",
                stepsTitle: "Installation Steps",
                step1: "Tap the button above and allow <strong>\"Download a configuration profile\"</strong>",
                step2: "Go to <strong>Settings</strong> → <strong>General</strong> → <strong>VPN & Device Management</strong>",
                step3_template: "Tap <strong>\"Cloak-{name}\"</strong>, then tap <strong>Install</strong> in the top right",
                step4: "Enter your passcode to complete installation",
                step5: "Return to home screen, you'll see the <strong>disguised icon</strong>",
                infoText: "If nothing happens, please check your network and try again",
                loading: "Preparing download..."
            },
            "zh-Hans": {
                appName: "Cloak",
                subtitle: "更换名称 · 伪装图标教程",
                btnText: "点击下载描述文件",
                stepsTitle: "安装步骤",
                step1: "点击上方按钮，允许<strong>“下载一个配置描述文件”</strong>",
                step2: "打开手机<strong>【设置】</strong> → <strong>【通用】</strong> → <strong>【VPN与设备管理】</strong>",
                step3_template: "点击<strong>“Cloak-{name}”</strong>，点击右上角<strong>【安装】</strong>",
                step4: "输入锁屏密码，完成安装",
                step5: "返回桌面，即可看到<strong>伪装图标</strong>",
                infoText: "如果点击后没有反应，请检查网络后重试",
                loading: "正在准备下载..."
            },
            "zh-Hant": {
                appName: "Cloak",
                subtitle: "更換名稱 · 偽裝圖標教程",
                btnText: "點擊下載描述檔",
                stepsTitle: "安裝步驟",
                step1: "點擊上方按鈕，允許<strong>「下載一個設定描述檔」</strong>",
                step2: "打開手機<strong>【設定】</strong> → <strong>【一般】</strong> → <strong>【VPN與裝置管理】</strong>",
                step3_template: "點擊<strong>「Cloak-{name}」</strong>，點擊右上角<strong>【安裝】</strong>",
                step4: "輸入解鎖密碼，完成安裝",
                step5: "返回桌面，即可看到<strong>偽裝圖標</strong>",
                infoText: "如果點擊後沒有反應，請檢查網路後重試",
                loading: "正在準備下載..."
            },
            "ja": {
                appName: "Cloak",
                subtitle: "名前変更 · 偽装アイコンチュートリアル",
                btnText: "設定プロファイルをダウンロード",
                stepsTitle: "インストール手順",
                step1: "上のボタンをタップし、<strong>「構成プロファイルをダウンロード」</strong>を許可",
                step2: "<strong>設定</strong> → <strong>一般</strong> → <strong>VPNとデバイス管理</strong>を開く",
                step3_template: "<strong>「Cloak-{name}」</strong>をタップし、右上の<strong>【インストール】</strong>をタップ",
                step4: "パスコードを入力してインストール完了",
                step5: "ホーム画面に戻ると<strong>偽装アイコン</strong>が表示されます",
                infoText: "反応がない場合は、ネットワークを確認してから再試行してください",
                loading: "ダウンロードの準備中..."
            },
            "ko": {
                appName: "Cloak",
                subtitle: "이름 변경 · 위장 아이콘 튜토리얼",
                btnText: "구성 프로필 다운로드",
                stepsTitle: "설치 단계",
                step1: "위 버튼을 탭하고 <strong>“구성 프로필 다운로드”</strong>를 허용",
                step2: "<strong>설정</strong> → <strong>일반</strong> → <strong>VPN 및 기기 관리</strong>로 이동",
                step3_template: "<strong>“Cloak-{name}”</strong>을 탭한 후 오른쪽 상단의 <strong>【설치】</strong>를 탭",
                step4: "암호를 입력하여 설치 완료",
                step5: "홈 화면으로 돌아가면 <strong>위장 아이콘</strong>이 표시됩니다",
                infoText: "반응이 없으면 네트워크를 확인하고 다시 시도하세요",
                loading: "다운로드 준비 중..."
            },
            "fr": {
                appName: "Cloak",
                subtitle: "Changer de nom · Tutoriel Icône de dissimulation",
                btnText: "Télécharger le profil de configuration",
                stepsTitle: "Étapes d'installation",
                step1: "Appuyez sur le bouton ci-dessus et autorisez <strong>« Télécharger un profil de configuration »</strong>",
                step2: "Allez dans <strong>Réglages</strong> → <strong>Général</strong> → <strong>VPN et gestion de l'appareil</strong>",
                step3_template: "Appuyez sur <strong>« Cloak-{name} »</strong>, puis sur <strong>Installer</strong> en haut à droite",
                step4: "Entrez votre code d'accès pour terminer l'installation",
                step5: "Retournez à l'écran d'accueil, vous verrez l'<strong>icône dissimulée</strong>",
                infoText: "Si rien ne se passe, vérifiez votre connexion et réessayez",
                loading: "Préparation du téléchargement..."
            }
        };

        // 固定英文名称（用于设置中显示）
        const presetEnglishNames = {
            'calculator': 'Calculator',
            'notes': 'Notes',
            'journal': 'Journal'
        };

        function getUserLanguage() {
            const lang = navigator.language || navigator.userLanguage;
            if (lang.startsWith('zh')) {
                return (lang.includes('TW') || lang.includes('HK')) ? 'zh-Hant' : 'zh-Hans';
            }
            if (lang.startsWith('ja')) return 'ja';
            if (lang.startsWith('ko')) return 'ko';
            if (lang.startsWith('fr')) return 'fr';
            return 'en';
        }

        function getPreset() {
            const params = new URLSearchParams(window.location.search);
            return params.get('preset') || 'calculator';
        }

        function getPresetEnglishName() {
            const preset = getPreset();
            return presetEnglishNames[preset] || preset;
        }

        function applyLanguage() {
            const lang = getUserLanguage();
            const t = translations[lang] || translations['en'];
            const englishName = getPresetEnglishName();
            
            document.getElementById('appName').textContent = t.appName;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('btnText').textContent = t.btnText;
            document.getElementById('stepsTitle').textContent = t.stepsTitle;
            document.getElementById('infoText').textContent = t.infoText;
            
            const step3Text = t.step3_template.replace('{name}', englishName);
            
            const stepsList = document.getElementById('stepsList');
            stepsList.innerHTML = `
                <div class="step-item"><div class="step-num">1</div><div class="step-text">${t.step1}</div></div>
                <div class="step-item"><div class="step-num">2</div><div class="step-text">${t.step2}</div></div>
                <div class="step-item"><div class="step-num">3</div><div class="step-text">${step3Text}</div></div>
                <div class="step-item"><div class="step-num">4</div><div class="step-text">${t.step4}</div></div>
                <div class="step-item"><div class="step-num">5</div><div class="step-text">${t.step5}</div></div>
            `;
            
            window.currentTranslations = t;
        }

        function getMobileConfigUrl() {
            const preset = getPreset();
            const lang = getUserLanguage();
            return `https://mobileconfigli.netlify.app/${preset}_${lang}.mobileconfig`;
        }

        function startDownload() {
            const btn = document.getElementById('downloadBtn');
            const t = window.currentTranslations || translations['en'];
            const originalHTML = btn.innerHTML;
            
            btn.innerHTML = `<span>⏳</span> ${t.loading}`;
            btn.classList.add('loading');
            btn.disabled = true;
            
            const fileUrl = getMobileConfigUrl();
            window.location.href = fileUrl;
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('loading');
                btn.disabled = false;
            }, 3000);
        }
        
        let autoDownloadDone = false;
        function autoDownload() {
            if (autoDownloadDone) return;
            autoDownloadDone = true;
            setTimeout(() => startDownload(), 1000);
        }
        
        applyLanguage();
        autoDownload();
    </script>
</body>
</html>
