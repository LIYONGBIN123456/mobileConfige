<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cloak</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            padding: 40px 0 20px;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1c1c1e;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #8e8e93;
            font-size: 14px;
            margin-bottom: 24px;
        }
        
        .download-btn {
            background-color: #007aff;
            border: none;
            width: 100%;
            padding: 16px 24px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .download-btn:active {
            background-color: #005fc1;
            transform: scale(0.98);
        }
        
        .download-btn.loading {
            background-color: #8e8e93;
            opacity: 0.7;
        }
        
        .steps-card {
            background-color: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .steps-title {
            font-size: 17px;
            font-weight: 600;
            color: #1c1c1e;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .steps-title::before {
            content: "📋";
            font-size: 18px;
        }
        
        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .step-num {
            width: 24px;
            height: 24px;
            background-color: #007aff;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            flex-shrink: 0;
        }
        
        .step-text {
            flex: 1;
            font-size: 15px;
            color: #3a3a3c;
            line-height: 1.4;
        }
        
        .step-text strong {
            color: #1c1c1e;
            font-weight: 600;
        }
        
        .info-card {
            background-color: #e8f4ff;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .info-icon {
            font-size: 24px;
        }
        
        .info-text {
            flex: 1;
            font-size: 13px;
            color: #0051a8;
            line-height: 1.4;
        }
        
        .status {
            text-align: center;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
        }
        
        .status.success {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        
        .status.error {
            background-color: #ffebee;
            color: #c62828;
        }
        
        .status.info {
            background-color: #e3f2fd;
            color: #1565c0;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="appName">Cloak</h1>
            <div class="subtitle" id="subtitle">Rename · Disguise Icon Tutorial</div>
        </div>
        
        <button class="download-btn" id="downloadBtn" onclick="startDownload()">
            <span>📲</span>
            <span id="btnText">Install to Home Screen</span>
        </button>
        
        <div id="status" class="status hidden"></div>
        
        <div class="steps-card">
            <div class="steps-title" id="stepsTitle">Installation Steps</div>

        <div class="info-card">

            <div class="info-text" id="infoText">
                If nothing happens, please check your network and try again

        // 获取用户语言，默认返回英文
        function getUserLanguage() {
            const lang = navigator.language || navigator.userLanguage;
            if (lang.startsWith('zh')) {
                if (lang.includes('TW') || lang.includes('HK')) {
                    return 'zh-Hant';
                }
                return 'zh-Hans';
            }
            if (lang.startsWith('ja')) return 'ja';
            if (lang.startsWith('ko')) return 'ko';
            if (lang.startsWith('fr')) return 'fr';
            if (lang.startsWith('de')) return 'de';
            if (lang.startsWith('es')) return 'es';
            if (lang.startsWith('ru')) return 'ru';
            if (lang.startsWith('ar')) return 'ar';
            // 默认返回英文
            return 'en';
        }

        // 应用多语言
        function applyLanguage() {
            const lang = getUserLanguage();
            const t = translations[lang] || translations['en'];
            
            document.getElementById('appName').textContent = t.appName;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('btnText').textContent = t.btnText;
            document.getElementById('stepsTitle').textContent = t.stepsTitle;
            document.getElementById('infoText').textContent = t.infoText;
            
            // 生成步骤列表
            const stepsList = document.getElementById('stepsList');
            stepsList.innerHTML = `
                <div class="step-item"><div class="step-num">1</div><div class="step-text">${t.step1}</div></div>
                <div class="step-item"><div class="step-num">2</div><div class="step-text">${t.step2}</div></div>
                <div class="step-item"><div class="step-num">3</div><div class="step-text">${t.step3}</div></div>
                <div class="step-item"><div class="step-num">4</div><div class="step-text">${t.step4}</div></div>
                <div class="step-item"><div class="step-num">5</div><div class="step-text">${t.step5}</div></div>
            `;
            
            // 保存翻译供下载函数使用
            window.currentTranslations = t;
        }

        // 获取预设类型
        function getPreset() {
            const params = new URLSearchParams(window.location.search);
            return params.get('preset') || 'calculator';
        }

        // 构建 CDN 链接
        function getCDNUrl() {
            const preset = getPreset();
            const lang = getUserLanguage();
            return `https://cdn.jsdelivr.net/gh/LIYONGBIN123456/mobileConfige@main/${preset}_${lang}.mobileconfig`;
        }

        // 显示状态消息
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.classList.remove('hidden');
            
            setTimeout(() => {
                statusDiv.classList.add('hidden');
            }, 3000);
        }

        // 开始下载
        function startDownload() {
            const btn = document.getElementById('downloadBtn');
            const t = window.currentTranslations || translations['en'];
            const originalHTML = btn.innerHTML;
            
            btn.innerHTML = `<span>⏳</span> <span>${t.loading}</span>`;
            btn.classList.add('loading');
            btn.disabled = true;
            
            const cdnUrl = getCDNUrl();
            
            setTimeout(() => {
                window.location.href = cdnUrl;
                
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.remove('loading');
                    btn.disabled = false;
                }, 2000);
            }, 500);
        }
        
        // 页面加载完成后自动尝试下载
        let autoDownloadDone = false;
        function autoDownload() {
            if (autoDownloadDone) return;
            autoDownloadDone = true;
            
            setTimeout(() => {
                startDownload();
            }, 1000);
        }
        
        // 初始化
        applyLanguage();
        
        // 默认自动下载
        autoDownload();
    </script>
